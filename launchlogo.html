<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap">
<style>html,body{margin:0;background:transparent}#l{display:inline-block;line-height:0}#l svg{width:233px;height:auto;display:block}</style></head><body>
<div id="l"></div>
<script>
/* the launch-screen logo (11/8): the board's title lockup, SLATE with a plain L and one thin gold line down its left edge, cap to
   baseline (the stem's left .36, the proportion of icon 127's now line). The same geometry as the board's lockup() (the glyphs,
   letter spacing .012em, the box 2 units past the cap and the baseline at a 100px face), drawn 233 points wide like the R2 logo before
   it, so it sits where the board's opening starts. */
const F = "800 100px 'Barlow Condensed'", INK = '#ece9e2', GOLD = '#f5b82e';
function stemOf(font, ch){
  const K = 4, W = 160 * K, H = 140 * K, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.font = font.replace('100px', 100 * K + 'px'); x.textBaseline = 'alphabetic'; x.fillStyle = '#000'; x.fillText(ch, 10 * K, 110 * K);
  const d = x.getImageData(0, 0, W, H).data, cols = [];
  for (let i = 0; i < W; i++){ let n = 0; for (let y = 20 * K; y < 80 * K; y++) if (d[(y * W + i) * 4 + 3] > 0) n++; cols.push(n); }
  const need = 30 * K; let l = cols.findIndex(n => n > need), r = l; if (l < 0) return null; while (r + 1 < W && cols[r + 1] > need) r++;
  let top = 110 * K; for (let y = 0; y < 110 * K; y++){ let hit = false; for (let i = l; i <= r; i++) if (d[(y * W + i) * 4 + 3] > 128){ hit = true; break; } if (hit){ top = y; break; } }
  return { x0: l / K - 10, x1: (r + 1) / K - 10, cap: (110 * K - top) / K };
}
document.fonts.load("800 100px 'Barlow Condensed'").then(() => document.fonts.ready).then(() => {
  const c = document.createElement('canvas').getContext('2d'); c.font = F; const w = s => c.measureText(s).width, ls = 1.2;
  let xs = 0; const chars = []; for (const ch of 'SLATE'){ chars.push([ch, xs]); xs += w(ch) + ls; } const W = xs - ls;
  const st = stemOf(F, 'L'), sx = chars[1][1] + st.x0, sw = st.x1 - st.x0, cap = st.cap, H = cap + 4;
  document.getElementById('l').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 ' + (-cap - 2) + ' ' + W + ' ' + H + '">' +
    '<g fill="' + INK + '" style="font:' + F + '">' + chars.map(([ch, x]) => '<text x="' + x + '" y="0">' + ch + '</text>').join('') + '</g>' +
    '<rect x="' + sx + '" y="' + (-cap) + '" width="' + (sw * 0.36) + '" height="' + cap + '" fill="' + GOLD + '"/></svg>';
  document.body.dataset.w = W; document.body.dataset.h = H; document.body.dataset.ready = '1';
});
</script></body></html>
