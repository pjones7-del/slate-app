# Slate for iPhone. XcodeGen turns this into Slate.xcodeproj on the build machine (the project file itself isn't kept in the repo).
name: Slate
options:
  bundleIdPrefix: io.github.pjones7-del
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"          # the version testers see; the build number comes from the workflow's run number
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - path: Slate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pjones7-del.slate   # permanent once the app is registered with Apple
        PRODUCT_NAME: Slate
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Slate/Info.plist
      properties:
        CFBundleDisplayName: Slate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        NSLocationWhenInUseUsageDescription: Slate uses your location once, to find your ZIP code for your local TV listings.
        NSCameraUsageDescription: Slate can read a bet slip from a photo you take.
        NSPhotoLibraryUsageDescription: Slate reads bet slips from the screenshots you pick.
    scheme: {}
